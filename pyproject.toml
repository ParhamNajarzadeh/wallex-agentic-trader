[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallex-agentic-trader"
version = "1.0.0"
description = "Multi-Agent Algorithmic Trading Engine (System-1 Jev/Mizan/Laya/Kev + Kronos + System-2 LangGraph ReAct Harness) for the Wallex StarCoach Hackathon Challenge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "StarCoach Quant & Agentic AI Team" }
]
dependencies = [
    "langgraph>=0.2.35",
    "langchain>=0.3.3",
    "langchain-openai>=0.2.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "torch>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "langfuse>=2.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
